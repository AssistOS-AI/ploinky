<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ploinky Administrative Terminal</title>
  <script src="/webtty/assets/webtty-bootstrap.js"></script>
  <link rel="stylesheet" href="/webtty/assets/xterm.css">
  <link rel="stylesheet" href="/webtty/assets/webtty.css">
</head>
<body>
  <header>
    <div>
      <h1>Workspace terminal</h1>
      <p class="warning">Administrative shell — commands run inside the selected target</p>
    </div>
    <div class="status" aria-live="polite">
      <span id="status-dot" class="status-dot"></span>
      <span id="status">Starting…</span>
    </div>
  </header>
  <main>
    <div class="details">
      <span>Target: <strong id="target">Not selected</strong></span>
      <span id="access" class="access-badge"></span>
      <span>Directory: <strong id="directory">Not selected</strong></span>
      <span id="dimensions">80 × 24</span>
    </div>
    <div id="message" class="message" role="alert" hidden></div>
    <div id="terminal" aria-label="Administrative workspace terminal"></div>
  </main>
  <script src="/webtty/assets/xterm.js"></script>
  <script src="/webtty/assets/addon-fit.js"></script>
  <script src="/webtty/assets/webtty.js"></script>
</body>
</html>
