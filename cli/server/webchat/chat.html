<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ploinky Chat</title>
    <link rel="stylesheet" href="__ASSET_BASE__/webchat.css"/>
</head>
<body data-page="chat" data-theme="explorer" data-agent="__AGENT_NAME__" data-title="__DISPLAY_NAME__"
      data-runtime="__RUNTIME__" data-base="__BASE_PATH__"
      data-agent-query="__AGENT_QUERY__" data-workdir="__WORKDIR__"
      data-workspace-base="__WORKSPACE_BASE__">
<div class="wa-header">
    <div class="wa-header-avatar">
        <span id="avatarInitial"></span>
    </div>
    <div class="wa-header-info">
        <div class="wa-header-title-row">
            <div class="wa-header-title" id="titleBar"></div>
            <span class="wa-runtime-model" id="runtimeModel" hidden></span>
        </div>
        <div class="wa-header-meta">
            <div class="wa-header-status" id="status">
                <span class="wa-status-dot offline"></span>
                <span id="statusText">disconnected</span>
            </div>
            <div class="wa-header-workdir" id="headerWorkdir"></div>
        </div>
    </div>
    <div class="wa-header-actions" id="headerActions">
        <button class="wa-session-btn wa-tasks-btn wa-responsive-header-action" id="tasksBtn" type="button"
                title="View background tasks" data-menu-action>
            Tasks <span class="wa-tasks-badge" id="tasksBadge" hidden></span>
        </button>
        <button class="wa-session-btn wa-responsive-header-action" id="sessionsBtn" type="button"
                title="View sessions" data-menu-action>Sessions</button>
        <button class="wa-icon-btn" id="settingsBtn" type="button" title="Menu" data-tooltip="Menu"
                aria-label="Open WebChat menu" aria-haspopup="dialog" aria-expanded="false"
                aria-controls="settingsPanel">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 7.25a1.25 1.25 0 1 0 0-2.5 1.25 1.25 0 0 0 0 2.5zM12 13.25a1.25 1.25 0 1 0 0-2.5 1.25 1.25 0 0 0 0 2.5zM12 19.25a1.25 1.25 0 1 0 0-2.5 1.25 1.25 0 0 0 0 2.5z"/>
            </svg>
        </button>
        <button class="wa-icon-btn wa-responsive-header-action" id="logoutBtn" type="button"
                title="Logout" data-tooltip="Logout" aria-label="Logout" data-menu-action>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M13.75 4.25a.75.75 0 0 1 .75-.75h2.75A2.75 2.75 0 0 1 20 6.25v11.5a2.75 2.75 0 0 1-2.75 2.75H14.5a.75.75 0 0 1 0-1.5h2.75a1.25 1.25 0 0 0 1.25-1.25V6.25A1.25 1.25 0 0 0 17.25 5H14.5a.75.75 0 0 1-.75-.75z"/>
                <path d="M11.53 7.47a.75.75 0 0 1 1.06 0l3.75 3.75a.75.75 0 0 1 0 1.06l-3.75 3.75a.75.75 0 1 1-1.06-1.06l2.47-2.47H5a.75.75 0 0 1 0-1.5h9l-2.47-2.47a.75.75 0 0 1 0-1.06z"/>
            </svg>
            <span class="wa-responsive-header-action-label">Logout</span>
        </button>
    </div>
</div>

<div class="wa-tasks-backdrop" id="tasksDialog" hidden>
    <section class="wa-tasks-dialog" role="dialog" aria-modal="true" aria-labelledby="tasksDialogTitle">
        <div class="wa-tasks-dialog-header">
            <h2 id="tasksDialogTitle">Tasks</h2>
            <button type="button" id="tasksDialogClose" aria-label="Close">×</button>
        </div>
        <div class="wa-tasks-layout">
            <div class="wa-tasks-list" id="tasksList"></div>
            <div class="wa-task-detail" id="taskDetail">
                <div class="wa-task-empty">Select a task to view its log.</div>
            </div>
        </div>
    </section>
</div>
<div class="wa-task-toast" id="taskToast" role="status" aria-live="polite" hidden>
    <span class="wa-task-toast-text" id="taskToastText"></span>
    <button class="wa-task-toast-close" id="taskToastClose" type="button" aria-label="Dismiss task notification">×</button>
</div>

<div class="wa-settings-panel" id="settingsPanel" role="dialog" aria-label="WebChat menu">
    <div class="wa-settings-mobile-actions" id="settingsMobileActions" hidden>
        <div class="wa-settings-header">Actions</div>
        <div class="wa-settings-action-slot" id="settingsActionSlot"></div>
        <div class="wa-settings-divider"></div>
    </div>
    <div class="wa-settings-section">
        <div class="wa-settings-header">Appearance</div>
        <label class="wa-settings-row">
            <span class="wa-settings-label">Theme</span>
            <select id="themeSelect">
                <option value="explorer">Explorer</option>
                <option value="light">Light</option>
                <option value="dark">Dark Eclipse</option>
                <option value="obsidian">Dark Obsidian</option>
            </select>
        </label>
        <label class="wa-settings-row">
            <span class="wa-settings-label">"View more" line limit</span>
            <input type="number" id="viewMoreLines" min="1" step="1" value="1000"/>
        </label>
    </div>
</div>

<div class="wa-connection-banner" id="connBanner">
    <span id="bannerText">Connecting…</span>
</div>

<div class="wa-main-content">
    <div class="wa-chat-container" id="chatContainer">
        <div class="wa-chat-area" id="chatArea">
            <div class="wa-chat-bg"></div>
            <div class="wa-messages" id="chatList">
                <div class="wa-history-gate" id="historyGate" hidden>
                    <button class="wa-history-load-button" type="button" id="loadHistoryBtn">
                        Click to load session history
                    </button>
                </div>
                <div class="wa-message in wa-typing" id="typingIndicator" aria-hidden="true">
                    <div class="wa-message-bubble">
                        <div class="wa-typing-status" role="status" aria-live="polite" aria-label="Processing">
                            <div class="wa-typing-heading">
                                <span class="wa-typing-label">Thinking</span>
                                <span class="wa-typing-dots" aria-hidden="true">
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                </span>
                            </div>
                            <div class="wa-typing-progress"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="wa-resizer" id="sidePanelResizer" aria-label="Resize panel" title="Drag to resize"></div>
        <div class="wa-side-panel" id="sidePanel">
            <div class="wa-side-panel-header">
                <h3 class="wa-side-panel-title">Full Answer</h3>
                <button class="wa-side-panel-close" id="sidePanelClose" aria-label="Close">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                    </svg>
                </button>
            </div>
            <div class="wa-side-panel-content">
                <div id="sidePanelContent" class="wa-side-panel-body"></div>
            </div>
        </div>
    </div>
</div>

<div class="wa-session-dialog-backdrop" id="sessionDialog" hidden>
    <section class="wa-session-dialog" role="dialog" aria-modal="true" aria-labelledby="sessionDialogTitle">
        <div class="wa-session-dialog-header">
            <h2 id="sessionDialogTitle">Sessions</h2>
            <button type="button" id="sessionDialogClose" aria-label="Close">×</button>
        </div>
        <div class="wa-session-list" id="sessionList"></div>
    </section>
</div>

<div class="wa-composer">
    <div id="filePreviewContainer" class="wa-file-preview-container"></div>
    <section id="interactionPrompt" class="wa-interaction-prompt" role="dialog" aria-modal="true" aria-labelledby="interactionPromptTitle" tabindex="-1" hidden>
        <div class="wa-interaction-copy">
            <strong id="interactionPromptTitle"></strong>
            <span id="interactionPromptMessage"></span>
            <code id="interactionPromptDetail"></code>
        </div>
        <div class="wa-interaction-input-row" id="interactionPromptInputRow" hidden>
            <input id="interactionPromptInput" autocomplete="off"/>
            <button type="button" id="interactionPromptSubmit">Continue</button>
            <button type="button" id="interactionPromptCancel" class="wa-interaction-cancel">Cancel</button>
        </div>
        <div id="interactionPromptOptions" class="wa-interaction-options" role="listbox" aria-label="Available actions"></div>
    </section>
    <div class="wa-composer-main">
        <div class="wa-attachment-container">
            <button class="wa-icon-btn" id="attachmentBtn" title="Attach">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M16.5 6.75v7.5a4.5 4.5 0 1 1-9 0V6.5a2.75 2.75 0 1 1 5.5 0v7.75a1 1 0 1 1-2 0V7.5a.75.75 0 0 0-1.5 0v6.75a2.5 2.5 0 1 0 5 0V6.5a4.25 4.25 0 1 0-8.5 0v7.75a6 6 0 1 0 12 0v-7.5a.75.75 0 0 0-1.5 0z"/>
                </svg>
            </button>
            <div class="wa-attachment-menu" id="attachmentMenu">
                <button id="uploadFileBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M9.97 4.22A1.25 1.25 0 0 1 11.22 4h1.56a1.25 1.25 0 0 1 1.25 1.25v3.67l1.78-1.78a.75.75 0 0 1 1.06 1.06l-3.25 3.25a.75.75 0 0 1-1.06 0L9.28 8.18a.75.75 0 1 1 1.06-1.06l1.63 1.63V5.25h-1.56a.25.25 0 0 0-.25.25v1.31l-1.2-1.2a1.25 1.25 0 0 1 .44-1.39zM4.75 6h3.5a.75.75 0 0 1 0 1.5h-3.5a.25.25 0 0 0-.25.25v11.5c0 .138.112.25.25.25h14.5a.25.25 0 0 0 .25-.25V12a.75.75 0 0 1 1.5 0v7.25A1.75 1.75 0 0 1 19.25 21H4.75A1.75 1.75 0 0 1 3 19.25V7.75A1.75 1.75 0 0 1 4.75 6z"></path>
                    </svg>
                    <span>Upload file</span>
                </button>
                <button id="uploadFolderBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h3.379a2.5 2.5 0 0 1 1.767.732l1.121 1.121a1 1 0 0 0 .707.293H17.5A2.5 2.5 0 0 1 20 8.646v8.854A2.5 2.5 0 0 1 17.5 20h-11A2.5 2.5 0 0 1 4 17.5v-11zM6.5 5.5a1 1 0 0 0-1 1V17.5a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V8.646a1 1 0 0 0-1-1h-4.026a2.5 2.5 0 0 1-1.768-.732l-1.12-1.121a1 1 0 0 0-.708-.293H6.5z"></path>
                    </svg>
                    <span>Upload folder</span>
                </button>
                <button id="cameraActionBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M4.5 6.75A2.25 2.25 0 0 1 6.75 4.5h1.17l.41-.82A1.5 1.5 0 0 1 9.7 3h4.6a1.5 1.5 0 0 1 1.37.68l.41.82h1.17A2.25 2.25 0 0 1 19.5 6.75v10.5A2.25 2.25 0 0 1 17.25 19.5h-10.5A2.25 2.25 0 0 1 4.5 17.25V6.75zm7.5 9a3.75 3.75 0 1 0 0-7.5 3.75 3.75 0 0 0 0 7.5zm0-1.5a2.25 2.25 0 1 1 0-4.5 2.25 2.25 0 0 1 0 4.5z"></path>
                    </svg>
                    <span>Camera</span>
                </button>
            </div>
        </div>
        <div class="wa-composer-input-wrapper">
      <textarea
              id="cmd"
              class="wa-composer-input"
              rows="1"
              placeholder="Type a message"
              autocomplete="off"
      ></textarea>
        </div>
        <button class="wa-send-btn" id="send" title="Send">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
                <path d="M4.46 4.67a1 1 0 0 1 1.08-.18l13.7 6.2a1.45 1.45 0 0 1 0 2.62l-13.7 6.2A1 1 0 0 1 4.13 18.4l1.67-5.34 8.26-1.06-8.26-1.06-1.67-5.34a1 1 0 0 1 .33-.93z"/>
            </svg>
        </button>
        <button class="wa-cancel-btn" id="cancelBtn" title="Cancel generation" aria-label="Cancel generation" style="display:none">
            <span class="wa-cancel-btn-core" aria-hidden="true"></span>
        </button>
    </div>
</div>
<script src="__ASSET_BASE__/markdown.js"></script>
<script>
    window.__WEBCHAT_ASSET_BASE__ = "__ASSET_BASE__";
</script>
<script type="module" src="__ASSET_BASE__/index.js"></script>
<input type="file" id="fileUploadInput" style="display:none" multiple/>
<input type="file" id="folderUploadInput" style="display:none" webkitdirectory multiple/>
</body>
</html>
