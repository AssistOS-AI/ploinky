<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Task logs</title>
    <link rel="stylesheet" href="__ASSET_BASE__/webchat.css"/>
</head>
<body class="wa-task-view-page" data-theme="explorer">
<main class="wa-task-view">
    <header class="wa-task-view-header">
        <strong class="wa-task-summary-agent" id="taskAgent">Task</strong>
        <span class="wa-task-summary-model" id="taskModel">default</span>
        <span class="wa-task-summary-description" id="taskDescription">Loading task…</span>
        <span class="wa-task-status is-unavailable" id="taskStatus">LOADING</span>
        <span class="wa-task-summary-duration" id="taskDuration"></span>
        <button type="button" class="wa-task-stop" id="taskStop" hidden>Stop</button>
    </header>
    <div class="wa-task-error" id="taskError" hidden></div>
    <div class="wa-task-action-error" id="taskActionError" hidden></div>
    <div class="wa-task-log" id="taskLog"></div>
    <section id="taskInteractionPrompt" class="wa-interaction-prompt" role="dialog" aria-modal="true" aria-labelledby="taskInteractionPromptTitle" tabindex="-1" hidden>
        <div class="wa-interaction-copy">
            <strong id="taskInteractionPromptTitle"></strong>
            <span id="taskInteractionPromptMessage"></span>
            <code id="taskInteractionPromptDetail"></code>
        </div>
        <div class="wa-interaction-input-row" id="taskInteractionPromptInputRow" hidden>
            <input id="taskInteractionPromptInput" autocomplete="off"/>
            <button type="button" id="taskInteractionPromptSubmit">Continue</button>
            <button type="button" id="taskInteractionPromptCancel" class="wa-interaction-cancel">Cancel</button>
        </div>
        <div id="taskInteractionPromptOptions" class="wa-interaction-options" role="listbox" aria-label="Available actions"></div>
    </section>
    <form class="wa-task-continuation" id="taskContinuation" hidden>
        <label for="taskContinuationInput">Continue this agent session</label>
        <div class="wa-task-continuation-row">
            <textarea id="taskContinuationInput" rows="1" maxlength="32768"
                placeholder="Send another message to this coding agent"></textarea>
            <button type="submit" id="taskContinuationSend">Send</button>
        </div>
        <div class="wa-task-continuation-error" id="taskContinuationError" hidden></div>
    </form>
</main>
<script type="module" src="__ASSET_BASE__/taskView.js"></script>
</body>
</html>
