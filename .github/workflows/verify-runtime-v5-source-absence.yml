name: Verify runtime-v5 source absence

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  source-absence:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Reject retired edge-publication source
        shell: bash
        run: |
          set -euo pipefail
          report="$(mktemp)"
          trap 'rm -f "$report"' EXIT

          node --test --test-reporter=tap \
            tests/unit/runtimeV5SourceAbsence.test.mjs \
            tests/unit/networkHardCutSourceAbsence.test.mjs | tee "$report"

          require_summary() {
            local field="$1"
            local expected="$2"
            local actual
            actual="$(awk -v field="$field" '$1 == "#" && $2 == field { print $3 }' "$report")"
            if [[ "$actual" != "$expected" ]]; then
              echo "source-absence gate expected $field=$expected, observed ${actual:-missing}" >&2
              exit 1
            fi
          }

          require_summary tests 7
          require_summary pass 7
          require_summary fail 0
          require_summary cancelled 0
          require_summary skipped 0
          require_summary todo 0
