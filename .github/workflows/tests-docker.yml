name: Daily Docker Tests

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docker-tests:
    runs-on: ubuntu-24.04
    env:
      CONTAINER_RUNTIME: docker
      TEST_REPORT_DIR: reports/docker
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Add Ploinky CLI to PATH
        run: echo "PATH=$PATH:${GITHUB_WORKSPACE}/bin" >> $GITHUB_ENV

      # The skill export protocol is shared byte-for-byte with Explorer; its
      # paired tests fail rather than skip without that checkout.
      - name: Check out the paired Explorer
        run: |
          explorer="${RUNNER_TEMP}/AssistOSExplorer"
          url=https://github.com/AssistOS-AI/AssistOSExplorer.git
          if git ls-remote --exit-code --heads "$url" "$GITHUB_REF_NAME" >/dev/null; then
            git clone --depth 1 --branch "$GITHUB_REF_NAME" "$url" "$explorer"
          else
            git clone --depth 1 "$url" "$explorer"
          fi
          echo "PLOINKY_TEST_EXPLORER_CHECKOUT=$explorer" >> "$GITHUB_ENV"

      - name: Run test suite (Docker runtime)
        run: |
          set -o pipefail
          mkdir -p "${TEST_REPORT_DIR}"
          ./tests/test_all.sh | tee "${TEST_REPORT_DIR}/latest.log"

      - name: Upload test log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-test-log
          path: ${{ env.TEST_REPORT_DIR }}/latest.log

      - name: Commit updated test report
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain "${TEST_REPORT_DIR}/latest.log")" ]; then
            git config --global user.name "github-actions"
            git config --global user.email "actions@github.com"
            git add "${TEST_REPORT_DIR}/latest.log"
            git commit -m "chore: update docker test report"
            git push
          else
            echo "No report changes to commit."
          fi
