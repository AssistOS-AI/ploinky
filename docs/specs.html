<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ploinky Documentation</title>
    <link rel="stylesheet" href="style.css">
    <script src="partials-loader.js" defer></script>
    <script>
        window.mermaidReady = import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs').then(({ default: mermaid }) => {
            mermaid.initialize({ startOnLoad: false, theme: 'neutral' });
            return mermaid;
        });
    </script>
    <style>
        .specifications-page-header {
            border-bottom: 1px solid var(--border-primary);
        }

        .spec-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 2rem;
            width: 100%;
            padding: 2rem 0;
            align-items: start;
            min-height: calc(100vh - 230px);
        }

        .spec-sidebar {
            background: var(--bg-primary);
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            padding: 1.5rem 0;
            position: sticky;
            top: 100px;
            max-height: calc(100vh - 120px);
            overflow-y: auto;
            overscroll-behavior: contain;
            scrollbar-gutter: stable;
        }

        .spec-main-panel {
            min-width: 0;
        }

        .spec-sidebar h3 {
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0 1.25rem;
            margin-bottom: 0.75rem;
        }

        .spec-sidebar ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .spec-sidebar li a {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            padding: 0.5rem 1.25rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            line-height: 1.4;
            transition: all 0.15s ease;
            border-left: 3px solid transparent;
        }

        .spec-sidebar li a:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .spec-sidebar li a.active {
            background: var(--bg-active);
            color: var(--text-link);
            border-left-color: var(--text-link);
            font-weight: 500;
        }

        .spec-sidebar .spec-id {
            font-family: 'Cascadia Code', 'SF Mono', Monaco, monospace;
            font-size: 0.75rem;
            color: var(--text-tertiary);
            min-width: 36px;
        }

        .spec-sidebar li a.active .spec-id {
            color: var(--text-link);
        }

        .spec-sidebar .sidebar-section {
            margin-bottom: 1.5rem;
        }

        .spec-sidebar .sidebar-section:last-child {
            margin-bottom: 0;
        }

        .spec-content {
            background: var(--bg-primary);
            padding: 2rem 3rem;
            min-width: 0;
            min-height: 100%;
            overflow-y: auto;
        }

        /* Markdown content styling */
        .spec-content .md-body h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid var(--border-primary);
            color: var(--text-primary);
        }

        .spec-content .md-body h2 {
            font-size: 1.5rem;
            margin-top: 2.5rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-primary);
            color: var(--text-primary);
        }

        .spec-content .md-body h3 {
            font-size: 1.2rem;
            margin-top: 2rem;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
        }

        .spec-content .md-body h4 {
            font-size: 1rem;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
        }

        .spec-content .md-body p {
            margin-bottom: 1rem;
            color: var(--text-primary);
            line-height: 1.7;
        }

        .spec-content .md-body ul,
        .spec-content .md-body ol {
            margin-bottom: 1rem;
            padding-left: 1.5rem;
            line-height: 1.7;
        }

        .spec-content .md-body li {
            margin-bottom: 0.35rem;
        }

        .spec-content .md-body pre {
            background: var(--bg-code);
            border: 1px solid var(--border-primary);
            border-radius: 8px;
            padding: 1rem 1.25rem;
            overflow-x: auto;
            margin: 1rem 0;
            font-size: 0.875rem;
            line-height: 1.5;
        }

        .spec-content .md-body pre code {
            background: none;
            padding: 0;
            color: var(--text-primary);
            font-size: inherit;
        }

        .spec-content .md-body code {
            background: var(--bg-code);
            padding: 0.15em 0.4em;
            border-radius: 4px;
            font-size: 0.9em;
            color: var(--text-code);
        }

        .spec-content .md-body table {
            width: 100%;
            max-width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
            margin: 1rem 0;
            font-size: 0.9rem;
        }

        .spec-content .md-body th {
            background: var(--bg-tertiary);
            text-align: left;
            padding: 0.75rem 1rem;
            font-weight: 600;
            color: var(--text-primary);
            border-bottom: 2px solid var(--border-primary);
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .spec-content .md-body td {
            padding: 0.6rem 1rem;
            border-bottom: 1px solid var(--border-primary);
            color: var(--text-primary);
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .spec-content .md-body td code,
        .spec-content .md-body th code {
            white-space: normal;
            overflow-wrap: anywhere;
        }

        .spec-content .md-body tr:hover td {
            background: var(--bg-hover);
        }

        .spec-content .md-body blockquote {
            border-left: 4px solid var(--bg-header);
            padding: 0.5rem 1rem;
            margin: 1rem 0;
            background: var(--bg-secondary);
            border-radius: 0 8px 8px 0;
            color: var(--text-secondary);
        }

        .spec-content .md-body strong {
            color: var(--text-primary);
        }

        .spec-content .md-body a {
            color: var(--text-link);
            text-decoration: none;
        }

        .spec-content .md-body a:hover {
            text-decoration: underline;
        }

        .spec-content .md-body hr {
            border: none;
            border-top: 1px solid var(--border-primary);
            margin: 2rem 0;
        }

        /* Loading state */
        .spec-loading {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .spec-loading .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid var(--border-primary);
            border-top-color: var(--bg-header);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Welcome card */
        .spec-welcome {
            width: 100%;
            margin: 2rem 0;
        }

        .spec-welcome h2 {
            margin-bottom: 1rem;
            font-size: 1.75rem;
            color: var(--text-primary);
        }

        .spec-welcome p {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            line-height: 1.7;
        }

        .spec-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 0.75rem;
        }

        .spec-card {
            display: flex;
            align-items: baseline;
            gap: 0.75rem;
            padding: 0.85rem 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-primary);
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.15s ease;
            font-size: 0.9rem;
        }

        .spec-card:hover {
            border-color: var(--bg-header);
            background: var(--bg-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .spec-card .card-id {
            font-family: 'Cascadia Code', 'SF Mono', Monaco, monospace;
            font-size: 0.75rem;
            color: var(--text-tertiary);
            min-width: 36px;
        }

        /* Search */
        .spec-search {
            padding: 0.75rem 1.25rem;
            margin-bottom: 0.5rem;
        }

        .spec-search input {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--border-primary);
            border-radius: 6px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.15s ease;
        }

        .spec-search input:focus {
            border-color: var(--bg-header);
        }

        .spec-search input::placeholder {
            color: var(--text-tertiary);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .spec-layout {
                grid-template-columns: 1fr;
            }

            .spec-sidebar {
                position: relative;
                top: 0;
                height: auto;
                max-height: none;
                border-right: none;
                border-bottom: 1px solid var(--border-primary);
                padding: 1rem 0;
            }

            .spec-content {
                padding: 1.5rem 1rem;
            }
        }

        /* Scrollbar */
        .spec-sidebar::-webkit-scrollbar {
            width: 8px;
        }
        .spec-sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        .spec-sidebar::-webkit-scrollbar-thumb {
            background: var(--border-primary);
            border-radius: 3px;
        }
    </style>
</head>
<body data-page="spec-browser">
    <div data-include="partials/header.html"></div>
    <main>
      <div class="container">
        <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="index.html">Ploinky Documentation</a> / Specifications</nav>
        <div class="spec-layout">
          <aside class="spec-sidebar">
            <div class="spec-search">
                <input type="text" id="specSearch" placeholder="Filter specs...">
            </div>

            <div id="specGroups"></div>
          </aside>

          <div class="content-wrapper spec-main-panel">
            <div class="doc-section specifications-page-header">
              <h1>Specifications</h1>
              <p class="subtitle">Browse the Ploinky design specifications that define system behavior, runtime boundaries, interfaces, security, operational requirements, and the rationale behind active architectural decisions.</p>
            </div>
            <div class="spec-content" id="specContent">
              <!-- Content loaded dynamically -->
            </div>
          </div>
        </div>
      </div>
    </main>
    <div data-include="partials/footer.html"></div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        // Spec data
        const specs = [
            { id: 'DS001', file: 'DS001-vision', title: 'Vision', group: 'Core' },
            { id: 'DS002', file: 'DS002-coding-style', title: 'Coding Style', group: 'Core' },
            { id: 'DS003', file: 'DS003-workspace-and-repository-model', title: 'Workspace & Repository Model', group: 'Core' },
            { id: 'DS004', file: 'DS004-main-behavior', title: 'Main Behavior', group: 'Core' },
            { id: 'DS005', file: 'DS005-agent-manifest-and-registry', title: 'Agent Manifest & Registry', group: 'Core' },
            { id: 'DS006', file: 'DS006-runtime-execution-and-isolation', title: 'Runtime Execution & Isolation', group: 'Runtime' },
            { id: 'DS007', file: 'DS007-routing-and-web-surfaces', title: 'Routing & Web Surfaces', group: 'Interfaces' },
            { id: 'DS008', file: 'DS008-auth-capabilities-and-secure-wire', title: 'Auth, Capabilities & Secure Wire', group: 'Interfaces' },
            { id: 'DS009', file: 'DS009-dependency-caches-and-startup-readiness', title: 'Dependency Caches & Startup Readiness', group: 'Runtime' },
            { id: 'DS010', file: 'DS010-secrets-and-variable-resolution', title: 'Secrets & Variable Resolution', group: 'Configuration' },
            { id: 'DS011', file: 'DS011-observability', title: 'Observability', group: 'Operations' },
            { id: 'DS012', file: 'DS012-testing-and-verification', title: 'Testing & Verification', group: 'Operations' },
            { id: 'DS013', file: 'DS013-security-model', title: 'Security Model', group: 'Interfaces' },
            { id: 'DS014', file: 'DS014-local-llm-agent-architecture-catalog', title: 'Local LLM Agent Catalog', group: 'Configuration' },
            { id: 'DS015', file: 'DS015-per-agent-identity-and-request-signed-jwts', title: 'Per-Agent Identity & JWTs', group: 'Interfaces' },
            { id: 'DS016', file: 'DS016-router-access-control-http-route-access-and-mcp-policy', title: 'Router Access Control', group: 'Interfaces' },
            { id: 'DS017', file: 'DS017-startup-config-providers', title: 'Startup Config Providers', group: 'Runtime' }
        ];

        const groupOrder = ['Core', 'Runtime', 'Interfaces', 'Configuration', 'Operations'];
        const groupsContainer = document.getElementById('specGroups');
        groupsContainer.innerHTML = groupOrder.map(group => {
            const entries = specs.filter(spec => spec.group === group);
            if (!entries.length) return '';
            const items = entries.map(spec => `<li><a id="${spec.id}" href="specs/${spec.file}.md" data-id="${spec.id}" data-spec="${spec.file}"><span class="spec-id">${spec.id}</span> ${spec.title}</a></li>`).join('');
            return `<div class="sidebar-section" data-group="${group}"><h3>${group}</h3><ul>${items}</ul></div>`;
        }).join('');

        const content = document.getElementById('specContent');
        const links = document.querySelectorAll('.spec-sidebar a[data-spec]');
        const cache = {};

        // Show welcome / overview
        function showWelcome() {
            let cards = '';
            specs.forEach(s => {
                cards += `<a href="specs/${s.file}.md" class="spec-card" onclick="loadSpec('${s.file}','${s.id}');return false;"><span class="card-id">${s.id}</span> ${s.title}</a>`;
            });

            content.innerHTML = `
                <div class="spec-welcome">
                    <h2>Specifications</h2>
                    <p>The Ploinky Design Specification (DS) documents define the complete system architecture, from core agent model to runtime operations. Select a spec from the sidebar or click below.</p>
                </div>
                <div class="spec-grid">${cards}</div>
            `;
        }

        // Load and render a spec
        async function loadSpec(file, id) {
            // Update active link
            links.forEach(l => l.classList.remove('active'));
            const activeLink = document.querySelector(`a[data-spec="${file}"]`);
            if (activeLink) activeLink.classList.add('active');

            // Update URL hash without scroll
            history.replaceState(null, '', '#' + id);

            // Show loading
            if (!cache[file]) {
                content.innerHTML = '<div class="spec-loading"><div class="spinner"></div><div>Loading specification...</div></div>';
            }

            try {
                // Fetch markdown (with cache)
                if (!cache[file]) {
                    const resp = await fetch(`specs/${file}.md`);
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                    cache[file] = await resp.text();
                }

                // Strip YAML frontmatter, then render markdown
                var md = cache[file].replace(/^---[\s\S]*?---\s*/, '');
                var html = marked.parse(md);
                html = html.replace(
                    /<pre><code class="language-mermaid">([\s\S]*?)<\/code><\/pre>/g,
                    function(_, body) {
                        var decoded = body.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');
                        return '<pre class="mermaid">' + decoded + '</pre>';
                    }
                );
                content.textContent = '';
                var wrapper = document.createElement('div');
                wrapper.className = 'md-body';
                wrapper.innerHTML = html;
                content.appendChild(wrapper);
                content.scrollTop = 0;
                const diagramNodes = content.querySelectorAll('.mermaid');
                if (diagramNodes.length) {
                    const mermaid = await window.mermaidReady;
                    await mermaid.run({ nodes: diagramNodes });
                }

                // Rewrite internal DS links to work within the viewer
                content.querySelectorAll('.md-body a').forEach(a => {
                    const href = a.getAttribute('href');
                    if (href && href.match(/(?:^\.\/|[?&]spec=)DS\d{3}/)) {
                        const match = href.match(/DS(\d{3})/);
                        if (match) {
                            const dsNum = 'DS' + match[1];
                            const spec = specs.find(s => s.id === dsNum);
                            if (spec) {
                                a.href = '#' + dsNum;
                                a.onclick = (e) => {
                                    e.preventDefault();
                                    loadSpec(spec.file, spec.id);
                                };
                            }
                        }
                    }
                });
            } catch (err) {
                content.innerHTML = `<div class="spec-loading"><p>Failed to load specification: ${err.message}</p><p><a href="specs/${file}.md">Open the Markdown specification directly</a></p></div>`;
            }
        }

        // Search/filter
        document.getElementById('specSearch').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            document.querySelectorAll('.spec-sidebar li').forEach(li => {
                const text = li.textContent.toLowerCase();
                li.style.display = text.includes(query) ? '' : 'none';
            });
            // Show/hide section headers if all children hidden
            document.querySelectorAll('.sidebar-section').forEach(section => {
                const visible = section.querySelectorAll('li:not([style*="display: none"])');
                section.style.display = visible.length > 0 ? '' : 'none';
            });
        });

        // Sidebar click handling
        links.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const file = link.dataset.spec;
                const id = link.dataset.id;
                loadSpec(file, id);
            });
        });

        // Handle initial hash or show welcome
        function handleHash() {
            const hash = location.hash.slice(1);
            if (hash) {
                const spec = specs.find(s => s.id === hash);
                if (spec) {
                    loadSpec(spec.file, spec.id);
                    return;
                }
            }
            showWelcome();
        }

        window.addEventListener('hashchange', handleHash);
        handleHash();
    </script>
</body>
</html>
